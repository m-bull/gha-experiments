---
name: Test exit codes
on:
  workflow_dispatch:

jobs:
  test-job:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Test exit codes
        shell: bash
        id: test
        run: echo -e "v0.12.0\n${VERSION}" | sort -V -C
        env:
          VERSION: "v0.11.3"
          URL: https://example.com/${VERSION}
        continue-on-error: true

      - name: Test env vars
        shell: bash
        run: |
          URL=https://example.com/${VERSION}
          echo ${URL}
        env:
          VERSION: "v0.11.3"

      - name: Run if success
        if: ${{ steps.test.outcome == 'success' }}
        run: echo SUCCESS

      - name: Run if failure
        if: ${{ steps.test.outcome != 'success' }}
        run: echo FAILURE


